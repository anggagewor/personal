          type: string
        subject_type:
          type: string
        subject_id:
          type: integer
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    # ─── Pagination ───────────────────────────────────────────────────────────────
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
