        created_at:
          type: string
          format: date-time

    # ─── Vault ────────────────────────────────────────────────────────────────────
    VaultEntry:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        username:
          type: string
          nullable: true
        encrypted_password:
          type: string
        url:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    VaultEntryInput:
      type: object
      required: [name, encrypted_password]
      properties:
        name:
          type: string
          maxLength: 255
        username:
          type: string
          maxLength: 255
          nullable: true
        encrypted_password:
          type: string
        url:
          type: string
          maxLength: 500
          nullable: true
        notes:
          type: string
          maxLength: 1000
          nullable: true
        category:
          type: string
          maxLength: 100
          nullable: true

    # ─── Converter ────────────────────────────────────────────────────────────────
    ConverterCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        units:
          type: array
          items:
            $ref: '#/components/schemas/ConverterUnit'

    ConverterUnit:
      type: object
      properties:
        id:
          type: integer
        category_id:
          type: integer
        name:
          type: string
        symbol:
          type: string
        to_base:
          type: number
        is_base:
          type: boolean

    # ─── Accounting ───────────────────────────────────────────────────────────────
    Account:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/AccountType'
        parent_id:
          type: integer
          nullable: true
        balance:
          type: number

    AccountInput:
      type: object
      required: [code, name, type]
      properties:
        code:
          type: string
          maxLength: 10
          pattern: '^[a-zA-Z0-9]+$'
        name:
          type: string
          maxLength: 100
        type:
          $ref: '#/components/schemas/AccountType'
        parent_id:
          type: integer
          nullable: true

    JournalEntry:
      type: object
      properties:
        id:
          type: integer
        date:
          type: string
          format: date
        description:
          type: string
        lines:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              account_id:
                type: integer
              account_name:
                type: string
              debit:
                type: number
              credit:
                type: number
        created_at:
          type: string
          format: date-time

    JournalEntryInput:
      type: object
      required: [date, description, lines]
      properties:
        date:
          type: string
          format: date
        description:
          type: string
          maxLength: 255
        lines:
          type: array
          minItems: 2
          maxItems: 20
          items:
            type: object
            required: [account_id, debit, credit]
            properties:
              account_id:
                type: integer
              debit:
                type: number
                minimum: 0
              credit:
                type: number
                minimum: 0

    # ─── Activity ─────────────────────────────────────────────────────────────────
    ActivityLog:
      type: object
      properties:
        id:
          type: integer
