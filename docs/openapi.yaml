          $ref: '#/components/schemas/MarketType'
        label:
          type: string
          nullable: true
        position:
          type: integer

    PriceSnapshot:
      type: object
      properties:
        symbol:
          type: string
        price:
          type: number
        change:
          type: number
        change_percent:
          type: number
        previous_close:
          type: number
          nullable: true
        fetched_at:
          type: string
          format: date-time
          nullable: true

    MarketDashboardItem:
      type: object
      properties:
        id:
          type: integer
        symbol:
          type: string
        type:
          $ref: '#/components/schemas/MarketType'
        label:
          type: string
          nullable: true
        price:
          type: number
          nullable: true
        change:
          type: number
          nullable: true
        change_percent:
          type: number
          nullable: true
        previous_close:
          type: number
          nullable: true
        sparkline:
          type: array
          items:
            type: number

    # ─── Budget ───────────────────────────────────────────────────────────────────
    Budget:
      type: object
