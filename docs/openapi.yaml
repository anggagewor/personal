          nullable: true
        created_at:
          type: string
          format: date-time

    # ─── Wishlist ─────────────────────────────────────────────────────────────────
    WishlistItem:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        purchased:
          type: boolean
        created_at:
          type: string
          format: date-time

    # ─── Reading List ─────────────────────────────────────────────────────────────
    ReadingItem:
      type: object
      properties:
