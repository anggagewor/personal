openapi: 3.0.3
info:
  title: Purdia Dashboard API
  description: Personal productivity dashboard API — auth, notes, tasks, calendar, finance, habits, and more.
  version: 1.0.0
  contact:
    name: Purdia

servers:
  - url: http://localhost:8000/api
    description: Local development

security:
  - BearerAuth: []

tags:
  - name: Auth
    description: Authentication (login, register, refresh, logout)
  - name: Profile
    description: User profile management
  - name: Preferences
    description: User preferences (theme, locale, etc.)
  - name: Notes
    description: Notes CRUD + pin toggle
  - name: Tasks
    description: Task management + reorder
  - name: Bookmarks
    description: Bookmark URLs
  - name: Calendar
    description: Calendar events & holidays
  - name: Finance
    description: Personal income/expense tracking
  - name: Habits
    description: Habit tracking + toggle
  - name: Pomodoro
    description: Pomodoro timer sessions
  - name: Scratchpad
    description: Quick scratch notes
  - name: Journal
    description: Daily journal entries + mood
  - name: Goals
    description: Goal setting & milestones
  - name: Tags
    description: Tagging system
  - name: Quotes
    description: Motivational quotes
  - name: Wishlist
    description: Wishlist items
  - name: ReadingList
    description: Reading list management
  - name: Market
    description: Market watchlist & price history
  - name: Gold
    description: Emas Antam (harga harian)
  - name: Budget
    description: Monthly budgets
  - name: Vault
    description: Password vault
  - name: Converter
    description: Custom unit converter
  - name: Accounting
    description: Double-entry accounting
  - name: GoogleDrive
    description: Google Drive integration
  - name: Trash
    description: Soft-delete restore
  - name: Activity
    description: Activity logs
  - name: Dashboard
    description: Dashboard & weather

paths:
  # ─── AUTH ─────────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/register:
    post:
      tags: [Auth]
      summary: Register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
                  maxLength: 255
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
      responses:
        '201':
          description: Registrasi berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh token
      responses:
        '200':
          description: Token baru
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      refresh_token:
                        type: string

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (revoke all tokens)
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      responses:
        '200':
          description: Current user data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserBasic'

  # ─── PROFILE ──────────────────────────────────────────────────────────────────
  /profile:
    get:
      tags: [Profile]
      summary: Get profile
      responses:
        '200':
          description: Profile data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Profile'
    put:
      tags: [Profile]
      summary: Update profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
                  maxLength: 255
      responses:
        '200':
          description: Profil berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Profile'
                  message:
                    type: string
        '422':
          $ref: '#/components/responses/ValidationError'

  /profile/password:
    put:
      tags: [Profile]
      summary: Update password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password:
                  type: string
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'
        '422':
          $ref: '#/components/responses/ValidationError'

  /profile/avatar:
    post:
      tags: [Profile]
      summary: Upload avatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
                  description: Image file (jpg, jpeg, png, webp). Max 2MB.
      responses:
        '200':
          description: Avatar berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      avatar:
                        type: string
                        format: uri
                  message:
                    type: string
    delete:
      tags: [Profile]
      summary: Remove avatar
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'

  # ─── PREFERENCES ──────────────────────────────────────────────────────────────
  /preferences:
    get:
      tags: [Preferences]
      summary: Get preferences
      responses:
        '200':
          description: Preferences data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Preferences'
    put:
      tags: [Preferences]
      summary: Update preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
      responses:
        '200':
          description: Preferensi berhasil disimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Preferences'
                  message:
                    type: string

  # ─── NOTES ────────────────────────────────────────────────────────────────────
  /notes:
    get:
      tags: [Notes]
      summary: List notes (paginated)
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated notes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Note'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      tags: [Notes]
      summary: Create note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                title:
                  type: string
                  maxLength: 255
                content:
                  type: string
                is_pinned:
                  type: boolean
      responses:
        '201':
          description: Catatan berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Note'
                  message:
                    type: string
        '422':
          $ref: '#/components/responses/ValidationError'

  /notes/{id}:
    get:
      tags: [Notes]
      summary: Get single note
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Note detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Note'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Notes]
      summary: Update note
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 255
                content:
                  type: string
                is_pinned:
                  type: boolean
      responses:
        '200':
          description: Catatan berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Note'
                  message:
                    type: string
    delete:
      tags: [Notes]
      summary: Delete note
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'

  /notes/{id}/toggle-pin:
    post:
      tags: [Notes]
      summary: Toggle pin status
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Pin status toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Note'
                  message:
                    type: string

  # ─── TASKS ────────────────────────────────────────────────────────────────────
  /tasks:
    get:
      tags: [Tasks]
      summary: List tasks (paginated)
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/TaskPriority'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      tags: [Tasks]
      summary: Create task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '201':
          description: Task berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Task'
                  message:
                    type: string
        '422':
          $ref: '#/components/responses/ValidationError'

  /tasks/{id}:
    get:
      tags: [Tasks]
      summary: Get single task
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Task detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Task'
    put:
      tags: [Tasks]
      summary: Update task
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '200':
          description: Task berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Task'
                  message:
                    type: string
    delete:
      tags: [Tasks]
      summary: Delete task
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'

  /tasks/reorder:
    post:
      tags: [Tasks]
      summary: Reorder tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ordered_ids]
              properties:
                ordered_ids:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'

  # ─── BOOKMARKS ────────────────────────────────────────────────────────────────
  /bookmarks:
    get:
      tags: [Bookmarks]
      summary: List bookmarks
      responses:
        '200':
          description: All bookmarks
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bookmark'
    post:
      tags: [Bookmarks]
      summary: Create bookmark
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookmarkInput'
      responses:
        '201':
          description: Bookmark berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Bookmark'
                  message:
                    type: string

  /bookmarks/{id}:
    put:
      tags: [Bookmarks]
      summary: Update bookmark
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookmarkInput'
      responses:
        '200':
          description: Bookmark berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Bookmark'
                  message:
                    type: string
    delete:
      tags: [Bookmarks]
      summary: Delete bookmark
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'

  # ─── CALENDAR ─────────────────────────────────────────────────────────────────
  /calendar-events:
    get:
      tags: [Calendar]
      summary: List calendar events
      responses:
        '200':
          description: All events
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CalendarEvent'
    post:
      tags: [Calendar]
      summary: Create calendar event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarEventInput'
      responses:
        '201':
          description: Event berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CalendarEvent'
                  message:
                    type: string

  /calendar-events/{id}:
    get:
      tags: [Calendar]
      summary: Get single event
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Event detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CalendarEvent'
    put:
      tags: [Calendar]
      summary: Update event
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarEventInput'
      responses:
        '200':
          description: Event berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CalendarEvent'
                  message:
                    type: string
    delete:
      tags: [Calendar]
      summary: Delete event
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'

  /holidays:
    get:
      tags: [Calendar]
      summary: List holidays (authenticated)
      responses:
        '200':
          description: Holidays list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Holiday'

  /public/holidays:
    get:
      tags: [Calendar]
      summary: List holidays (public, no auth)
      security: []
      responses:
        '200':
          description: Holidays list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Holiday'

  # ─── FINANCE ──────────────────────────────────────────────────────────────────
  /finances:
    get:
      tags: [Finance]
      summary: List finances
      responses:
        '200':
          description: Finance records
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Finance'
    post:
      tags: [Finance]
      summary: Create finance record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceInput'
      responses:
        '201':
          description: Finance record created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Finance'
                  message:
                    type: string

  /finances/{id}:
    put:
      tags: [Finance]
      summary: Update finance record
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceInput'
      responses:
        '200':
          description: Finance record updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Finance'
                  message:
                    type: string
    delete:
      tags: [Finance]
      summary: Delete finance record
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'

  /finances/summary:
    get:
      tags: [Finance]
      summary: Get finance summary
      responses:
        '200':
          description: Summary (income, expense, balance)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object

  # ─── HABITS ───────────────────────────────────────────────────────────────────
  /habits:
    get:
      tags: [Habits]
      summary: List habits
      responses:
        '200':
          description: All habits
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Habit'
    post:
      tags: [Habits]
      summary: Create habit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 255
                frequency:
                  type: string
                  enum: [daily, weekly]
      responses:
        '201':
          description: Habit berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Habit'
                  message:
                    type: string

  /habits/{id}:
    put:
      tags: [Habits]
      summary: Update habit
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                frequency:
                  type: string
                  enum: [daily, weekly]
      responses:
        '200':
          description: Habit berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Habit'
                  message:
                    type: string
    delete:
      tags: [Habits]
      summary: Delete habit
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'

  /habits/{id}/toggle:
    post:
      tags: [Habits]
      summary: Toggle habit completion for today
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Habit toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Habit'
                  message:
                    type: string

  # ─── POMODORO ─────────────────────────────────────────────────────────────────
  /pomodoros:
    get:
      tags: [Pomodoro]
      summary: List pomodoros
      responses:
        '200':
          description: Pomodoro sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pomodoro'
    post:
      tags: [Pomodoro]
      summary: Start pomodoro session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                task_id:
                  type: integer
                  nullable: true
                duration:
                  type: integer
                  minimum: 1
                  maximum: 120
                  description: Duration in minutes
      responses:
        '201':
          description: Pomodoro session started
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Pomodoro'
                  message:
                    type: string

  /pomodoros/{id}/complete:
    post:
      tags: [Pomodoro]
      summary: Complete pomodoro session
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Pomodoro completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Pomodoro'
                  message:
                    type: string

  /pomodoros/{id}/cancel:
    post:
      tags: [Pomodoro]
      summary: Cancel pomodoro session
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'

  /pomodoros/stats:
    get:
      tags: [Pomodoro]
      summary: Get pomodoro statistics
      responses:
        '200':
          description: Statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object

  # ─── SCRATCHPAD ───────────────────────────────────────────────────────────────
  /scratchpads:
    get:
      tags: [Scratchpad]
      summary: List scratchpads
      responses:
        '200':
          description: All scratchpads
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Scratchpad'
    post:
      tags: [Scratchpad]
      summary: Create scratchpad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  nullable: true
                color:
                  type: string
                  maxLength: 50
                  nullable: true
                position:
                  type: integer
      responses:
        '201':
          description: Scratchpad berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Scratchpad'
                  message:
                    type: string

  /scratchpads/{id}:
    put:
      tags: [Scratchpad]
      summary: Update scratchpad
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  nullable: true
                color:
                  type: string
                  maxLength: 50
                  nullable: true
                position:
                  type: integer
      responses:
        '200':
          description: Scratchpad berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Scratchpad'
                  message:
