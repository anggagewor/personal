components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum Token

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        default: 15

  responses:
    MessageOnly:
      description: Success message
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string

  schemas:
    # ─── Enums ────────────────────────────────────────────────────────────────────
    TaskStatus:
      type: string
      enum: [pending, in_progress, completed]

    TaskPriority:
      type: string
      enum: [low, medium, high]

    FinanceType:
      type: string
      enum: [income, expense]

    GoalStatus:
      type: string
      enum: [active, completed, abandoned]

    JournalMood:
      type: string
      enum: [happy, neutral, sad, excited, anxious]
      nullable: true

    PomodoroStatus:
      type: string
      enum: [running, completed, cancelled]

    MarketType:
      type: string
      enum: [forex, crypto, stock, commodity]

    AccountType:
      type: string
      enum: [asset, liability, equity, revenue, expense]

    # ─── Auth & User ──────────────────────────────────────────────────────────────
    AuthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/UserBasic'
            token:
              type: string
            refresh_token:
              type: string

    UserBasic:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        preferences:
          $ref: '#/components/schemas/Preferences'

    Profile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        avatar:
          type: string
          format: uri
          nullable: true
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    Preferences:
      type: object
      properties:
        theme:
          type: string
          enum: [light, dark, system]
        primary_color:
          type: string
          enum: [indigo, blue, emerald, rose, amber, teal, violet, slate]
        locale:
          type: string
          enum: [id, en]
        sidebar_collapsed:
          type: boolean
        timezones:
          type: array
          maxItems: 10
          items:
            type: object
            properties:
              label:
                type: string
                maxLength: 50
              timezone:
                type: string

    # ─── Note ─────────────────────────────────────────────────────────────────────
    Note:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        title:
          type: string
        content:
          type: string
        is_pinned:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ─── Task ─────────────────────────────────────────────────────────────────────
    Task:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        due_date:
          type: string
          format: date
          nullable: true
        position:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaskInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        due_date:
          type: string
          format: date
          nullable: true
        position:
          type: integer
          minimum: 0

    # ─── Bookmark ─────────────────────────────────────────────────────────────────
    Bookmark:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        url:
          type: string
          format: uri
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    BookmarkInput:
      type: object
      required: [title, url]
      properties:
        title:
          type: string
          maxLength: 255
        url:
          type: string
          format: uri
          maxLength: 2048
        description:
          type: string
          maxLength: 1000
          nullable: true
        category:
          type: string
          maxLength: 100
          nullable: true
        icon:
          type: string
          maxLength: 255
          nullable: true

    # ─── Calendar ─────────────────────────────────────────────────────────────────
    CalendarEvent:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
          nullable: true
        color:
          type: string
          nullable: true
        all_day:
          type: boolean
        created_at:
          type: string
          format: date-time

    CalendarEventInput:
      type: object
      required: [title, start_at]
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
          nullable: true
        color:
          type: string
          maxLength: 20
          nullable: true
        all_day:
          type: boolean

    Holiday:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        date:
          type: string
          format: date

    # ─── Finance ──────────────────────────────────────────────────────────────────
    Finance:
      type: object
      properties:
        id:
          type: integer
        type:
          $ref: '#/components/schemas/FinanceType'
        amount:
          type: number
        category:
          type: string
        description:
          type: string
          nullable: true
        date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time

    FinanceInput:
      type: object
      required: [type, amount, category, date]
      properties:
        type:
          $ref: '#/components/schemas/FinanceType'
        amount:
          type: number
          minimum: 0
        category:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
          nullable: true
        date:
          type: string
          format: date

    # ─── Habit ────────────────────────────────────────────────────────────────────
    Habit:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        frequency:
          type: string
          enum: [daily, weekly]
        streak:
          type: integer
        completed_today:
          type: boolean
        created_at:
          type: string
          format: date-time

    # ─── Pomodoro ─────────────────────────────────────────────────────────────────
    Pomodoro:
      type: object
      properties:
        id:
          type: integer
        task_id:
          type: integer
          nullable: true
        duration:
          type: integer
        status:
          $ref: '#/components/schemas/PomodoroStatus'
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true

    # ─── Scratchpad ───────────────────────────────────────────────────────────────
    Scratchpad:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        position:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ─── Journal ──────────────────────────────────────────────────────────────────
    Journal:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
        mood:
          $ref: '#/components/schemas/JournalMood'
        date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time

    # ─── Goal ─────────────────────────────────────────────────────────────────────
    Goal:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        target_date:
          type: string
          format: date
          nullable: true
        status:
          $ref: '#/components/schemas/GoalStatus'
        milestones:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              title:
                type: string
              completed:
                type: boolean
        created_at:
          type: string
          format: date-time

    GoalInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        target_date:
          type: string
          format: date
          nullable: true
        status:
          $ref: '#/components/schemas/GoalStatus'
        milestones:
          type: array
          items:
            type: object
            required: [title]
            properties:
              title:
                type: string
                maxLength: 255

    # ─── Tag ──────────────────────────────────────────────────────────────────────
    Tag:
      type: object
